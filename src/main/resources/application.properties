# Spring Application Name
spring.application.name=location-service

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/locationdb
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=location-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890123456789012345678901234
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads
file.upload.max-size=5242880

# Actuator Configuration (for monitoring)
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.locationapp.service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# API Documentation (Swagger/OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Android Documentation Crawler Configuration
android.crawler.base-url=https://developer.android.com/reference
android.crawler.kotlin-url=https://developer.android.com/reference/kotlin
android.crawler.max-depth=3
android.crawler.max-pages-per-category=100
android.crawler.request-delay-ms=1000
android.crawler.max-retries=3
android.crawler.timeout-seconds=30
android.crawler.use-selenium=false
android.crawler.user-agent=Mozilla/5.0 (Educational Android Documentation Crawler)

# Crawler Output Settings
android.crawler.output-directory=./android-docs-output
android.crawler.generate-markdown=true
android.crawler.generate-json=true
android.crawler.generate-llm-format=true
android.crawler.generate-diagrams=true
android.crawler.generate-examples=true
android.crawler.generate-explanations=true
android.crawler.generate-use-cases=true

# ProAndroidDev Medium Crawler Configuration
medium.crawler.publication-id=c72404660798
medium.crawler.publication-name=ProAndroidDev
medium.crawler.publication-url=https://proandroiddev.com
medium.crawler.max-articles=100
medium.crawler.request-delay-ms=2000
medium.crawler.max-retries=3
medium.crawler.timeout-seconds=30
medium.crawler.user-agent=Mozilla/5.0 (Educational Medium Crawler)

# Medium Article Filtering
medium.crawler.filter-after-date=2024-08-01T00:00:00
medium.crawler.only-recent-articles=true

# Medium Content Extraction
medium.crawler.extract-full-text=true
medium.crawler.extract-images=true
medium.crawler.extract-code-snippets=true

# Medium Summarization
medium.crawler.generate-summaries=true
medium.crawler.generate-tldr=true
medium.crawler.generate-key-takeaways=true
medium.crawler.summary-max-length=500

# Medium Output Settings
medium.crawler.output-directory=./medium-articles-output
medium.crawler.generate-markdown=true
medium.crawler.generate-json=true
medium.crawler.generate-llm-format=true
